[package]
name = "ddm-server"
version = "0.1.0"
edition = "2021"
description = "Docker Deployment Manager — generic compose service manager"

# Handlers return `Result<_, axum::Response>` everywhere by convention.
[lints.clippy]
result_large_err = "allow"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6.1"
futures = "0.3"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
regex = "1"
globset = "0.4"
num_cpus = "1.17"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
bollard = { version = "0.17" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "smtp-transport", "builder"], default-features = false }
fs2 = "0.4"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tokio-util = { version = "0.7", features = ["codec"] }
rmcp = { version = "3.5", features = ["server", "transport-streamable-http-server"] }
schemars = "1"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.24"
tower = "0.5"
