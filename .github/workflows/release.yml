name: Release
# Tagged releases ship the standard install artifact: a single
# ddm-server binary per arch (web UI embedded) + bare-metal assets.
# The Docker image is still built by ci.yml on main — optional packaging.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: Swatinem/rust-cache@v2
      - name: Build web UI (embedded into the binary)
        run: npm ci && npm run build
        working-directory: web
      - name: Build ddm-server (${{ matrix.target }})
        run: cargo build --release -p ddm-server --target ${{ matrix.target }}
      - name: Package tarball
        run: |
          set -eu
          v="${GITHUB_REF_NAME#v}"
          stage="ddm-${v}-linux-${{ matrix.arch }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/ddm-server" "$stage/ddm-server"
          cp deploy/bare-metal/config.yaml "$stage/config.yaml"
          cp deploy/bare-metal/ddm.service "$stage/ddm.service"
          cp deploy/bare-metal/install.sh "$stage/install.sh"
          chmod +x "$stage/install.sh"
          tar -czf "${stage}.tar.gz" "$stage"
          ls -la "${stage}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ddm-${{ matrix.arch }}
          path: ddm-*-linux-${{ matrix.arch }}.tar.gz

  publish:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "ddm ${GITHUB_REF_NAME}" \
            --generate-notes
