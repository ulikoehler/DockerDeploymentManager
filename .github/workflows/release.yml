name: Release
# Tagged releases ship the standard install artifact: a single
# statically-linked (musl) ddm-server binary per arch — no libc
# dependency, runs on any Linux — with the web UI embedded, plus
# bare-metal assets. The Docker image is still built by ci.yml on
# main — optional packaging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # The bootstrap installer compares `ddm-server --version` (Cargo.toml)
      # against the release tag — a mismatch makes every install look like
      # an upgrade. Fail early instead of shipping a lying binary.
      - name: Verify tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE=$(grep -m1 '^version' crates/ddm-server/Cargo.toml | cut -d'"' -f2)
          test "$TAG" = "$CRATE" || { echo "tag v$TAG != crate version $CRATE"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install musl C toolchain (for ring/cc-rs)
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: Swatinem/rust-cache@v2
      - name: Build web UI (embedded into the binary)
        run: npm ci && npm run build
        working-directory: web
      - name: Build ddm-server (${{ matrix.target }})
        run: |
          triple="${{ matrix.target }}"
          env_name="$(echo "$triple" | tr '[:lower:]-' '[:upper:]_')"
          cc="$(echo "$triple" | sed 's/-unknown//')-gcc"
          export "CARGO_TARGET_${env_name}_LINKER=$cc"
          cargo build --release -p ddm-server --target "$triple"
      - name: Package tarball
        run: |
          set -eu
          v="${GITHUB_REF_NAME#v}"
          [ "$v" = "$GITHUB_REF_NAME" ] && v="dev-$(git rev-parse --short HEAD)"
          stage="ddm-${v}-linux-${{ matrix.arch }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/ddm-server" "$stage/ddm-server"
          cp deploy/bare-metal/config.yaml "$stage/config.yaml"
          cp deploy/bare-metal/ddm.service "$stage/ddm.service"
          cp deploy/bare-metal/install.sh "$stage/install.sh"
          chmod +x "$stage/install.sh"
          tar -czf "${stage}.tar.gz" "$stage"
          ls -la "${stage}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ddm-${{ matrix.arch }}
          path: ddm-*-linux-${{ matrix.arch }}.tar.gz

  publish:
    needs: binary
    # Only create a GitHub release for tag pushes; workflow_dispatch
    # runs just upload build artifacts for testing.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "ddm ${GITHUB_REF_NAME}" \
            --generate-notes
